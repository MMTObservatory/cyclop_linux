name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # The tests use the simulated camera, so Aravis is not needed here.
      - run: pip install -e '.[test]'
      - run: pytest -v
