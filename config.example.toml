# cyclop configuration. Anything left out takes the default in cyclop/config.py,
# which mirrors the Windows SeeingMonitor_Cyclop settings at the MMTO.

[site]
latitude = 31.686944
longitude = -110.884167      # east-positive
timezone = "America/Phoenix"
max_sun_alt = -5.0

[camera]
address = "192.168.2.59"
exposure_us = 3906.25        # 1/256 s
gain = 12.43                 # dB (camera range 0-15)
frame_rate = 132.0           # max for the 640x480 region; clipped to what each region allows

[measurement]
n_samples = 3000
max_zenith_seeing = 7.0
detrend = 1
chunk_frames = 256           # frames centroided together while the next chunk is acquired
chunk_seconds = 2.0

[output]
data_dir = "~/cyclop_data"
save_motion = false   # also write Windows-style *_Motion.txt / *_results.txt per block

[web]
enabled = true
host = "0.0.0.0"             # read-only status pages at http://<host>:8080/
port = 8080
# The plots read history from <data_dir>/Seeing_Data.txt; add other files (e.g. the Windows
# software's log) to plot them too:
# history_files = ["/mnt/c/Users/Timothy Pickering/Documents/MiniCyclop/Data/Seeing_Data.txt"]

[redis]
enabled = true
# host/port default to $REDISHOST/$REDISPORT, then redis.mmto.arizona.edu:6379
